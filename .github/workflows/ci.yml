name: ExactMoE CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Execute tests
        run: python -m pytest -q
      - name: Check CLI parity
        run: exactmoe demo
      - name: Compile sources
        run: python -m compileall -q exactmoe
      - name: Verify Windows PowerShell collector syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/run-m4-profile.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify AI platform profiler syntax and basic Windows execution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/profile-ai-hardware.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          & ./scripts/profile-ai-hardware.ps1 -OutputPath ./artifacts/hardware/ci-hardware.json
          $report = Get-Content -Raw ./artifacts/hardware/ci-hardware.json | ConvertFrom-Json
          if ($report.schema_version -ne 1 -or -not $report.processor) {
            throw 'Missing basic hardware report fields'
          }
      - name: Validate read-only Windows GLM-5.3 first-run script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'scripts/first-run-glm53.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          $absent = Join-Path $env:TEMP 'exactmoe-no-model-download'
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/first-run-glm53.ps1 -ModelDir $absent
          if ($LASTEXITCODE -ne 0) { throw 'Read-only missing-model scenario failed' }
